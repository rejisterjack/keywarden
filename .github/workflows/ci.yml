name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keywarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: Test
        env:
          KEYWARDEN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/keywarden?sslmode=disable
        run: go test ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          KEYWARDEN_API_URL: http://127.0.0.1:8080
          KEYWARDEN_ADMIN_TOKEN: ci-admin-token-value
          KEYWARDEN_DASHBOARD_PASSWORD: ci-dashboard-password
          KEYWARDEN_SESSION_SECRET: ci-session-secret-value

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build proxy image
        run: docker build -f deploy/Dockerfile -t keywarden:ci .

  journey:
    needs: image
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: keywarden
    steps:
      - uses: actions/checkout@v4
      - name: Boot the demo
        run: docker compose -f deploy/compose/docker-compose.yml up --build -d
      - name: Quickstart
        run: KEYWARDEN_ADMIN_TOKEN=local-dev-admin-token ./scripts/quickstart.sh
      - name: Dashboard that cannot reach the proxy
        run: |
          docker run -d --name keywarden-dashboard-down \
            -e KEYWARDEN_API_URL=http://127.0.0.1:9 \
            -e KEYWARDEN_ADMIN_TOKEN=local-dev-admin-token \
            -e KEYWARDEN_DASHBOARD_PASSWORD=local-demo-password \
            -e KEYWARDEN_SESSION_SECRET=local-demo-session-secret \
            -p 3002:3000 \
            keywarden-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Playwright
        working-directory: dashboard
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_DOWN_URL: http://127.0.0.1:3002
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Stop
        if: always()
        run: |
          docker rm -f keywarden-dashboard-down || true
          docker compose -f deploy/compose/docker-compose.yml down -v
