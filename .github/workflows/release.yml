name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release-tag:
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - id: resolve
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          tag=${subject#"release: "}
          tag=${tag%%[[:space:]]*}
          tag=${tag%$'\r'}
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9][0-9A-Za-z._+-]*$'; then
            echo "commit subject must start with release: vX.Y.Z (got: ${tag})"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: release-tag
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keywarden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: Test
        env:
          KEYWARDEN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/keywarden?sslmode=disable
        run: go test ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

  binaries:
    needs: [release-tag, test]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: Tag the release commit
        run: git tag -f "${{ needs.release-tag.outputs.tag }}"
      - name: Build
        env:
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${RELEASE_TAG#v}"
          name="keywarden_${version}_${GOOS}_${GOARCH}"
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X github.com/rejisterjack/keywarden/internal/version.Version=${version}" \
            -o "dist/${name}" ./cmd/keywarden
          (cd dist && sha256sum "${name}" > "${name}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: keywarden-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  image:
    needs: [release-tag, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release-tag.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
      - name: Make the package public
        continue-on-error: true
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${GITHUB_REPOSITORY#*/}" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [release-tag, binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: keywarden-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release-tag.outputs.tag }}"
          notes="Release ${tag}. See CHANGELOG.md."
          if [ -f CHANGELOG.md ]; then
            notes="$(cat CHANGELOG.md)"
          fi
          gh release create "${tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${tag}" \
            --notes "${notes}"
