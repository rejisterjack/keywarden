# Local-only port override so the demo can run beside other projects that
# already hold 8080 and 3000. Not used by CI or the hosted deployment.
services:
  keywarden:
    ports: !override
      - "18080:8080"
    environment:
      KEYWARDEN_PUBLIC_URL: http://127.0.0.1:18080
      KEYWARDEN_FIXTURE_URL: http://127.0.0.1:18080/demo/mcp
  dashboard:
    ports: !override
      - "13000:3000"
