<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="kw-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#241b0d" />
      <stop offset="60%" stop-color="#110d06" />
      <stop offset="100%" stop-color="#080603" />
    </radialGradient>
    <linearGradient id="kw-stroke" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.5)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.08)" />
    </linearGradient>
    <linearGradient id="kw-gold" x1="140" y1="120" x2="370" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="kw-amber" x1="256" y1="140" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="kw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#kw-bg)" stroke="url(#kw-stroke)" stroke-width="6" />

  <!-- Ambient Amber Radiance -->
  <circle cx="256" cy="256" r="130" fill="#f59e0b" opacity="0.12" filter="url(#kw-glow)" />

  <!-- Cryptographic Vault & Lease Glyph -->
  <g transform="translate(0, -6)">
    <!-- Vault Outer Hexagonal Bastion -->
    <polygon points="256,92 380,164 380,308 256,380 132,308 132,164" fill="none" stroke="url(#kw-gold)" stroke-width="12" stroke-linejoin="round" />

    <!-- Lease Arch Outer Ring -->
    <circle cx="256" cy="216" r="54" fill="none" stroke="url(#kw-gold)" stroke-width="14" />

    <!-- Keyhole Chamber Column -->
    <path d="M 238 236 L 274 236 L 286 312 L 226 312 Z" fill="url(#kw-amber)" stroke="url(#kw-gold)" stroke-width="4" stroke-linejoin="round" />

    <!-- Cryptographic Core Prism -->
    <circle cx="256" cy="216" r="18" fill="#ffffff" filter="url(#kw-glow)" />
    <circle cx="256" cy="216" r="8" fill="#f59e0b" />

    <!-- Security Checkpoint Pins -->
    <circle cx="256" cy="92" r="6" fill="#fde68a" />
    <circle cx="380" cy="164" r="5" fill="#f59e0b" />
    <circle cx="380" cy="308" r="5" fill="#f59e0b" />
    <circle cx="256" cy="380" r="6" fill="#fde68a" />
    <circle cx="132" cy="308" r="5" fill="#f59e0b" />
    <circle cx="132" cy="164" r="5" fill="#f59e0b" />
  </g>
</svg>

